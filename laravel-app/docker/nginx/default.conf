server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 6M;

    # Normalize errors generated before Laravel; FastCGI application errors
    # retain their own response bodies (fastcgi_intercept_errors stays off).
    error_page 400 = @error_400;
    location @error_400 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 400 '{"status":400,"code":"bad_request","message":"Bad request."}';
    }
    error_page 403 = @error_403;
    location @error_403 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 403 '{"status":403,"code":"forbidden","message":"Access denied."}';
    }
    error_page 404 = @error_404;
    location @error_404 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 404 '{"status":404,"code":"not_found","message":"Resource not found."}';
    }
    error_page 405 = @error_405;
    location @error_405 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 405 '{"status":405,"code":"method_not_allowed","message":"Method not allowed."}';
    }
    error_page 408 = @error_408;
    location @error_408 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 408 '{"status":408,"code":"request_timeout","message":"Request timed out."}';
    }
    error_page 413 = @error_413;
    location @error_413 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 413 '{"status":413,"code":"payload_too_large","message":"Request body exceeds the 6 MiB limit."}';
    }
    error_page 414 = @error_414;
    location @error_414 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 414 '{"status":414,"code":"uri_too_long","message":"Request URI is too long."}';
    }
    error_page 429 = @error_429;
    location @error_429 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 429 '{"status":429,"code":"too_many_requests","message":"Too many requests."}';
    }
    error_page 500 = @error_500;
    location @error_500 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        return 500 '{"status":500,"code":"server_error","message":"Server error."}';
    }
    error_page 502 = @error_502;
    location @error_502 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Retry-After 5 always;
        return 502 '{"status":502,"code":"service_unavailable","message":"Application is unavailable."}';
    }
    error_page 503 = @error_503;
    location @error_503 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Retry-After 5 always;
        return 503 '{"status":503,"code":"service_unavailable","message":"Service is unavailable."}';
    }
    error_page 504 = @error_504;
    location @error_504 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Retry-After 5 always;
        return 504 '{"status":504,"code":"service_unavailable","message":"Application response timed out."}';
    }


    # These buildless assets keep stable names. Revalidate after deployments
    # so browsers do not keep an older theme or application script.
    location /assets/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Uploaded product images live on the shared storage volume.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
