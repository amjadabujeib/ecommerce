# Optional requirement 4 overlay. Apply with docker-compose.yml; see docs/runtime/requirement-4.md.
services:
  app:
    environment: &messaging-environment
      MESSAGING_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: novacart
      RABBITMQ_USER: novacart
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set a local RabbitMQ password}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: novacart
      REVERB_APP_KEY: ${REVERB_APP_KEY:-novacart-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set a local Reverb signing secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
      REVERB_PUBLIC_HOST: ${REVERB_PUBLIC_HOST:-localhost}
      REVERB_PUBLIC_PORT: ${APP_PORT:-8080}
      REVERB_PUBLIC_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
    # The SQL outbox allows startup/order persistence during broker outages.
    # Consumers/provisioner explicitly wait for the broker below.

  web:
    depends_on:
      app:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully

  scheduler:
    environment:
      <<: *messaging-environment

  rabbitmq:
    platform: linux/amd64
    image: docker.io/library/rabbitmq:4.4.0-management-alpine@sha256:598b474e2511f37a7408f3fa580f002684638f4ad6401395102b51e3209a9a51
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: novacart
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set a local RabbitMQ password}
      RABBITMQ_DEFAULT_VHOST: novacart
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: rabbitmq
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  messaging-setup:
    platform: linux/amd64
    image: localhost/novacart-core:local
    pull_policy: never
    restart: "no"
    environment: &worker-environment
      <<: *messaging-environment
      APP_NAME: NovaCart
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: novacart
      DB_USERNAME: novacart
      DB_PASSWORD: ${DB_PASSWORD:-novacart}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      JWT_TTL: ${JWT_TTL:-60}
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "messaging:setup"]
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-relay:
    platform: linux/amd64
    image: localhost/novacart-core:local
    pull_policy: never
    init: true
    stop_signal: SIGTERM
    restart: unless-stopped
    environment: *worker-environment
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "messaging:relay"]
    mem_limit: 192m
    depends_on:
      messaging-setup:
        condition: service_completed_successfully

  mail-worker:
    platform: linux/amd64
    image: localhost/novacart-core:local
    pull_policy: never
    init: true
    stop_signal: SIGTERM
    restart: unless-stopped
    environment:
      <<: *worker-environment
      MAIL_MAILER: smtp
      MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: NovaCart
      MAIL_TIMEOUT: 15
      MAIL_REQUIRE_ALLOWLIST: "true"
      MAIL_RECIPIENT_ALLOWLIST: ${MAIL_RECIPIENT_ALLOWLIST:-}
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "messaging:consume", "mail"]
    stop_grace_period: 30s
    mem_limit: 192m
    depends_on:
      messaging-setup:
        condition: service_completed_successfully

  realtime-worker:
    platform: linux/amd64
    image: localhost/novacart-core:local
    pull_policy: never
    init: true
    stop_signal: SIGTERM
    restart: unless-stopped
    environment: *worker-environment
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "messaging:consume", "realtime"]
    stop_grace_period: 30s
    mem_limit: 192m
    depends_on:
      messaging-setup:
        condition: service_completed_successfully
      reverb:
        condition: service_healthy

  reverb:
    platform: linux/amd64
    image: localhost/novacart-core:local
    pull_policy: never
    init: true
    stop_signal: SIGTERM
    restart: unless-stopped
    environment:
      <<: *worker-environment
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8081) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      app:
        condition: service_healthy

volumes:
  rabbitmq-data:
